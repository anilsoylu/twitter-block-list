<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Reply Filter for X</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img class="brand-icon" src="../../assets/icon.svg" alt="" width="32" height="32" />
        <h1 class="brand-name">AI Reply Filter <span class="brand-suffix">for X</span></h1>
        <span class="paused-badge" aria-hidden="true">Paused</span>
        <label class="switch">
          <span class="visually-hidden">Filter enabled</span>
          <input id="enabled" type="checkbox" role="switch" />
        </label>
      </header>

      <section class="stat-card" aria-labelledby="count-label">
        <div class="stat-row">
          <p class="stat">
            <span id="count" class="stat-number">0</span>
            <span id="count-label" class="stat-label">accounts filtered</span>
          </p>
          <button id="refresh" class="icon-button refresh-button" type="button" aria-label="Update now" title="Update now">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v5h-5" />
            </svg>
          </button>
        </div>
        <p class="stat-meta">
          <span id="updated"></span>
          <span id="change" hidden></span>
        </p>
      </section>

      <p id="error" class="alert" role="alert" hidden></p>

      <fieldset id="mode" class="mode">
        <legend class="section-title">When a listed account posts</legend>
        <div class="segmented">
          <label class="segment">
            <input type="radio" name="mode" value="collapse" />
            <span class="segment-name">Collapse</span>
            <span class="segment-hint">Show a notice</span>
          </label>
          <label class="segment">
            <input type="radio" name="mode" value="hide" />
            <span class="segment-name">Hide</span>
            <span class="segment-hint">Remove completely</span>
          </label>
        </div>
      </fieldset>

      <section class="allowlist-section" aria-labelledby="allowlist-heading">
        <h2 id="allowlist-heading" class="section-title">Always shown</h2>
        <ul id="allowlist" class="allowlist"></ul>
        <p id="allowlist-empty" class="allowlist-empty">
          No exceptions yet. Choose "Always show" on a filtered post to keep that account visible.
        </p>
      </section>

      <footer class="popup-footer">
        <p>List by <a href="https://blockedforaireply.com/" target="_blank" rel="noopener">blockedforaireply.com</a></p>
        <p>Not affiliated with X or levelsio</p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
