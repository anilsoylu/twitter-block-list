name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tagged commit $GITHUB_SHA is not on master"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip

      - name: Write checksums
        working-directory: .output
        run: |
          shopt -s nullglob
          zips=(*-chrome.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .output/*-chrome.zip, found ${#zips[@]}"
            exit 1
          fi
          sha256sum "${zips[0]}" > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .output/*-chrome.zip
            .output/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish release
        working-directory: release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          shopt -s nullglob
          zips=(*-chrome.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one *-chrome.zip artifact, found ${#zips[@]}"
            exit 1
          fi
          ZIP="${zips[0]}"
          NOTES="Download \`$ZIP\` below and follow the [install steps]($REPO_URL#install). To verify it, download \`SHA256SUMS\` next to it and run \`sha256sum -c SHA256SUMS\`."
          gh release create "$TAG" "$ZIP" SHA256SUMS \
            --title "AI Reply Filter for X $TAG" \
            --notes "$NOTES" \
            --generate-notes \
            --verify-tag
